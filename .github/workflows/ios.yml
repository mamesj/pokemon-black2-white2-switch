# Builds the iPhone and iPad download (pokemon-ds-wide-ios.ipa, tools/ios/build_all.sh), unsigned
# for sideloading, and starts a Simulator build of it once to check that it opens on its game list
# (a screenshot and its game.log are the run's artifacts; no ROM is ever given to this workflow,
# so no game is played here). Started by the maintainer's script or by hand (Actions tab).
#
# Its inputs are the Mac download's (the draft release mac-build-inputs, .github/workflows/mac.yml):
# SoulSilver and HeartGold's tables (addresses only), the game list's pictures and the icon.
name: iOS download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cmake>=3.21,<4" ninja
      - name: The inputs (tables of addresses, pictures, icon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p inputs
          gh release download mac-build-inputs -R "${{ github.repository }}" -p mac-inputs.tar.gz -D inputs
          tar -xzf inputs/mac-inputs.tar.gz -C inputs
          ls inputs
      - run: tools/ios/build_all.sh inputs/build-gen-tables inputs/box-art inputs/icon.jpg
        env:
          SSR_IOS_TARGET: ${{ matrix.target }}
          SSR_IOS_ARCH: x86_64
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'device'
        with:
          name: ios-ipa
          path: build-ios-dist/pokemon-ds-wide-ios.ipa
          if-no-files-found: error
      - name: A first start in the iOS Simulator
        if: matrix.target == 'simulator'
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x["udid"] for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(phones[-1])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "build-ios-dist/Pokemon Fulldex.app"
          xcrun simctl launch "$UDID" io.github.mamesj.pokemonds
          sleep 25
          mkdir -p sim
          xcrun simctl io "$UDID" screenshot sim/first-start.png
          DATA=$(xcrun simctl get_app_container "$UDID" io.github.mamesj.pokemonds data)
          ls -laR "$DATA/Documents" > sim/documents.txt || true
          cp "$DATA/Documents/game.log" sim/game.log || true
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "pokemon-ds-wide"' > sim/system.log || true
          cat sim/game.log || true
          grep -q '\[launcher\] folder' sim/game.log
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'simulator'
        with:
          name: ios-simulator-first-start
          path: sim/
          if-no-files-found: warn
